project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - methods.qmd
  resources:
    - outputs/maps/ontario_claims_caribou_map.pdf
    - images/motif.svg

website:
  title: "Ontario mining claims and caribou"
  site-url: https://emmabranch.github.io/ontario-claims-caribou/
  repo-url: https://github.com/emmabranch/ontario-claims-caribou
  favicon: images/favicon.png
  navbar:
    logo: images/motif.svg
    logo-alt: ""
    left:
      - href: index.qmd
        text: Findings
      - href: methods.qmd
        text: Methods and data
    right:
      - icon: github
        href: https://github.com/emmabranch/ontario-claims-caribou
  page-footer:
    center: "Independent portfolio project by Emma Branch. Not affiliated with WCS Canada."

format:
  html:
    theme: [flatly, brand, brand.scss, theme.scss]
    include-after-body: footer.html
    toc: false

knitr:
  opts_chunk:
    dev: "ragg_png"
    fig.retina: 3

execute:
  echo: false
  warning: false
  message: false
  freeze: auto
