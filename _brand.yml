meta:
  name: Emma Branch
  link:
    home: https://github.com/emmabranch
color:
  palette:
    ink: "#111111"
    paper: "#F3EEE3"
    white: "#FFFFFF"
    tomato: "#FF5A36"
    cobalt: "#2340FF"
    sunflower: "#FFD23F"
    kelp: "#00B386"
    hotpink: "#FF6FB0"
    lilac: "#B9A4FF"
    muted: "#5A544A"
  background: paper
  foreground: ink
  primary: cobalt
  secondary: muted
  success: kelp
  warning: sunflower
  danger: tomato
  light: paper
  dark: ink
typography:
  fonts:
    # Bunny Fonts: the same open fonts as Google Fonts, without the tracking
    - family: Bricolage Grotesque
      source: bunny
      weight: [400, 700, 800]
    - family: Space Mono
      source: bunny
      weight: [400, 700]
  base:
    family: Bricolage Grotesque
    line-height: 1.6
  headings:
    family: Bricolage Grotesque
    weight: 800
    color: ink
  monospace:
    family: Space Mono
  link:
    color: cobalt
